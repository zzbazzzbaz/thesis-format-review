# CI workflow for the deployable application image.
# Uses thesis_review/Dockerfile. The local UNO development/test image is
# thesis_review/Dockerfile.uno-dev and is intentionally not published here.
name: Thesis Review Docker CI

on:
  push:
    branches:
      - test
    paths:
      - "thesis_review/**"
      - ".gitea/workflows/uno-docker.yml"
  workflow_dispatch:

env:
  REGISTRY: git.gqt.plus
  IMAGE_NAME: gqt/thesis-review
  APP_DOCKERFILE: thesis_review/Dockerfile

jobs:
  docker-build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build application image
        run: |
          docker build \
            -f ${APP_DOCKERFILE} \
            -t ${REGISTRY}/${IMAGE_NAME}:${{ gitea.sha }} \
            -t ${REGISTRY}/${IMAGE_NAME}:latest \
            thesis_review

      - name: Login to Gitea Container Registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${REGISTRY} -u "${{ gitea.actor }}" --password-stdin

      - name: Push image
        run: |
          docker push ${REGISTRY}/${IMAGE_NAME}:${{ gitea.sha }}
          docker push ${REGISTRY}/${IMAGE_NAME}:latest
