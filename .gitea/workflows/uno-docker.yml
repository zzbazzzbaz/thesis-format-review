# CI/CD workflow for the deployable application images.
# The local UNO development/test image is thesis_review/Dockerfile.uno-dev and
# is intentionally not published here.
name: Thesis Review Docker CI/CD

on:
  push:
    branches:
      - test
      - dev-2
    paths:
      - "thesis_review/**"
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - ".gitea/workflows/uno-docker.yml"
  workflow_dispatch:

env:
  REGISTRY: git.gqt.plus
  THESIS_REVIEW_IMAGE_NAME: gqt/thesis-review
  THESIS_REVIEW_DOCKERFILE: thesis_review/Dockerfile
  BACKEND_IMAGE_NAME: gqt/thesis-review-backend
  BACKEND_DOCKERFILE: backend/Dockerfile
  FRONTEND_IMAGE_NAME: gqt/thesis-review-frontend
  FRONTEND_DOCKERFILE: frontend/Dockerfile
  DEPLOY_DIR: /home/ubuntu/thesis_review
  DEPLOY_HOST: 49.232.5.241
  DEPLOY_USER: ubuntu
  DEPLOY_PORT: 22
  PUBLIC_HOST: 49.232.5.241
  BACKEND_HOST_PORT: 18180
  FRONTEND_HOST_PORT: 18181

jobs:
  thesis-review-docker-build:
    name: Build and push thesis_review image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build thesis_review image
        run: |
          docker build \
            -f ${THESIS_REVIEW_DOCKERFILE} \
            -t ${REGISTRY}/${THESIS_REVIEW_IMAGE_NAME}:${{ gitea.sha }} \
            -t ${REGISTRY}/${THESIS_REVIEW_IMAGE_NAME}:latest \
            thesis_review

      - name: Login to Gitea Container Registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${REGISTRY} -u "${{ gitea.actor }}" --password-stdin

      - name: Push thesis_review image
        run: |
          docker push ${REGISTRY}/${THESIS_REVIEW_IMAGE_NAME}:${{ gitea.sha }}
          docker push ${REGISTRY}/${THESIS_REVIEW_IMAGE_NAME}:latest

  backend-docker-build:
    name: Build and push backend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            -f ${BACKEND_DOCKERFILE} \
            -t ${REGISTRY}/${BACKEND_IMAGE_NAME}:${{ gitea.sha }} \
            -t ${REGISTRY}/${BACKEND_IMAGE_NAME}:latest \
            backend

      - name: Login to Gitea Container Registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${REGISTRY} -u "${{ gitea.actor }}" --password-stdin

      - name: Push backend image
        run: |
          docker push ${REGISTRY}/${BACKEND_IMAGE_NAME}:${{ gitea.sha }}
          docker push ${REGISTRY}/${BACKEND_IMAGE_NAME}:latest

  frontend-docker-build:
    name: Build and push frontend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build frontend image
        run: |
          docker build \
            -f ${FRONTEND_DOCKERFILE} \
            -t ${REGISTRY}/${FRONTEND_IMAGE_NAME}:${{ gitea.sha }} \
            -t ${REGISTRY}/${FRONTEND_IMAGE_NAME}:latest \
            frontend

      - name: Login to Gitea Container Registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${REGISTRY} -u "${{ gitea.actor }}" --password-stdin

      - name: Push frontend image
        run: |
          docker push ${REGISTRY}/${FRONTEND_IMAGE_NAME}:${{ gitea.sha }}
          docker push ${REGISTRY}/${FRONTEND_IMAGE_NAME}:latest

  deploy:
    name: Deploy public stack
    runs-on: ubuntu-latest
    needs:
      - thesis-review-docker-build
      - backend-docker-build
      - frontend-docker-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_PORT }}
          source: "deploy/docker-compose.yml,deploy/nginx-thesis-reviews.conf"
          target: "${{ env.DEPLOY_DIR }}"
          strip_components: 1
          overwrite: true

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_PORT }}
          envs: DEPLOY_PASSWORD
          command_timeout: 60m
          script: |
            set -eu
            cd "${{ env.DEPLOY_DIR }}"

            if ! command -v docker >/dev/null 2>&1; then
              echo "docker is not installed on deploy host" >&2
              exit 1
            fi

            touch .env
            set_env() {
              key="$1"
              value="$2"
              if grep -q "^${key}=" .env; then
                sed -i "s|^${key}=.*|${key}=${value}|" .env
              else
                printf '%s=%s\n' "$key" "$value" >> .env
              fi
            }
            unset_env() {
              key="$1"
              if grep -q "^${key}=" .env; then
                sed -i "/^${key}=/d" .env
              fi
            }

            if ! grep -q '^DJANGO_SECRET_KEY=' .env; then
              set_env DJANGO_SECRET_KEY "$(openssl rand -hex 32)"
            fi
            set_env IMAGE_TAG "${{ gitea.sha }}"
            set_env PUBLIC_HOST "${{ env.PUBLIC_HOST }}"
            set_env BACKEND_HOST_PORT "${{ env.BACKEND_HOST_PORT }}"
            set_env FRONTEND_HOST_PORT "${{ env.FRONTEND_HOST_PORT }}"
            set_env DJANGO_ALLOWED_HOSTS "localhost,127.0.0.1,0.0.0.0,${{ env.PUBLIC_HOST }}"
            set_env DJANGO_CSRF_TRUSTED_ORIGINS "http://${{ env.PUBLIC_HOST }}"
            unset_env DJANGO_FORCE_SCRIPT_NAME
            unset_env DJANGO_SESSION_COOKIE_PATH
            unset_env DJANGO_CSRF_COOKIE_PATH
            unset_env STATIC_URL
            unset_env MEDIA_URL

            sudo_prefix="sudo -n"
            if ! sudo -n true >/dev/null 2>&1; then
              sudo_prefix="sudo -S"
            fi

            registry_username="${{ secrets.REGISTRY_USERNAME }}"
            if [ -z "$registry_username" ]; then
              registry_username="${{ gitea.actor }}"
            fi

            if [ "$sudo_prefix" = "sudo -S" ]; then
              printf '%s\n%s\n' "$DEPLOY_PASSWORD" "${{ secrets.REGISTRY_TOKEN }}" | sudo -S docker login "${{ env.REGISTRY }}" -u "$registry_username" --password-stdin
              printf '%s\n' "$DEPLOY_PASSWORD" | sudo -S docker compose pull
              printf '%s\n' "$DEPLOY_PASSWORD" | sudo -S docker compose up -d --remove-orphans
            else
              echo "${{ secrets.REGISTRY_TOKEN }}" | sudo -n docker login "${{ env.REGISTRY }}" -u "$registry_username" --password-stdin
              sudo -n docker compose pull
              sudo -n docker compose up -d --remove-orphans
            fi

            if [ "$sudo_prefix" = "sudo -S" ]; then
              printf '%s\n' "$DEPLOY_PASSWORD" | sudo -S mkdir -p /etc/nginx/snippets
              printf '%s\n' "$DEPLOY_PASSWORD" | sudo -S cp nginx-thesis-reviews.conf /etc/nginx/snippets/thesis-reviews.conf
              printf '%s\n' "$DEPLOY_PASSWORD" | sudo -S sh -c 'if [ -f /etc/nginx/conf.d/travel-planner-agent.conf ]; then rm -f /etc/nginx/conf.d/thesis-reviews.conf; grep -q "snippets/thesis-reviews.conf" /etc/nginx/conf.d/travel-planner-agent.conf || sed -i "/server_name 49.232.5.241;/a\\    include /etc/nginx/snippets/thesis-reviews.conf;" /etc/nginx/conf.d/travel-planner-agent.conf; else printf "%s\n" "server {" "    listen 80;" "    listen [::]:80;" "    server_name 49.232.5.241;" "    include /etc/nginx/snippets/thesis-reviews.conf;" "}" > /etc/nginx/conf.d/thesis-reviews.conf; fi'
              printf '%s\n' "$DEPLOY_PASSWORD" | sudo -S nginx -t
              printf '%s\n' "$DEPLOY_PASSWORD" | sudo -S systemctl reload nginx
            else
              sudo -n mkdir -p /etc/nginx/snippets
              sudo -n cp nginx-thesis-reviews.conf /etc/nginx/snippets/thesis-reviews.conf
              sudo -n sh -c 'if [ -f /etc/nginx/conf.d/travel-planner-agent.conf ]; then rm -f /etc/nginx/conf.d/thesis-reviews.conf; grep -q "snippets/thesis-reviews.conf" /etc/nginx/conf.d/travel-planner-agent.conf || sed -i "/server_name 49.232.5.241;/a\\    include /etc/nginx/snippets/thesis-reviews.conf;" /etc/nginx/conf.d/travel-planner-agent.conf; else printf "%s\n" "server {" "    listen 80;" "    listen [::]:80;" "    server_name 49.232.5.241;" "    include /etc/nginx/snippets/thesis-reviews.conf;" "}" > /etc/nginx/conf.d/thesis-reviews.conf; fi'
              sudo -n nginx -t
              sudo -n systemctl reload nginx
            fi

            if [ "$sudo_prefix" = "sudo -S" ]; then
              printf '%s\n' "$DEPLOY_PASSWORD" | sudo -S docker compose ps
              printf '%s\n' "$DEPLOY_PASSWORD" | sudo -S docker compose exec -T backend python manage.py shell -c "from django.contrib.auth import get_user_model; User = get_user_model(); user, _ = User.objects.get_or_create(username='admin'); user.role = 'admin'; user.name = user.name or '管理员'; user.is_staff = True; user.is_superuser = True; user.is_active = True; user.set_password('123456'); user.save(); print('admin ready')"
            else
              sudo -n docker compose ps
              sudo -n docker compose exec -T backend python manage.py shell -c "from django.contrib.auth import get_user_model; User = get_user_model(); user, _ = User.objects.get_or_create(username='admin'); user.role = 'admin'; user.name = user.name or '管理员'; user.is_staff = True; user.is_superuser = True; user.is_active = True; user.set_password('123456'); user.save(); print('admin ready')"
            fi
