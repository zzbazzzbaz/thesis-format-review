name: UNO Docker Image

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

env:
  REGISTRY: git.gqt.plus
  IMAGE_NAME: gqt/thesis-review-uno-dev
  SERVICE_DIR: thesis_review

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build UNO test image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SERVICE_DIR }}
          file: ${{ env.SERVICE_DIR }}/Dockerfile.uno-dev
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ gitea.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Run Python tests in UNO image
        run: |
          docker run --rm \
            -v "$PWD/${SERVICE_DIR}:/workspace" \
            -w /workspace \
            "${REGISTRY}/${IMAGE_NAME}:${{ gitea.sha }}" \
            /opt/venv/bin/python -m pytest -q

      - name: Login to Gitea Container Registry
        if: ${{ gitea.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Push UNO test image
        if: ${{ gitea.event_name != 'pull_request' }}
        run: |
          docker push "${REGISTRY}/${IMAGE_NAME}:${{ gitea.sha }}"
          docker push "${REGISTRY}/${IMAGE_NAME}:latest"
