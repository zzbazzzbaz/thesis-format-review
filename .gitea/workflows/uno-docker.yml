name: UNO Docker Image

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "thesis_review/**"
      - ".gitea/workflows/uno-docker.yml"
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "thesis_review/**"
      - ".gitea/workflows/uno-docker.yml"
  workflow_dispatch:

env:
  REGISTRY: git.gqt.plus
  IMAGE_NAME: gqt/thesis-review-uno-dev

jobs:
  docker-build:
    name: Build and push UNO image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build UNO image
        run: |
          docker build \
            -f thesis_review/Dockerfile.uno-dev \
            -t thesis-review-uno-dev:ci \
            -t ${REGISTRY}/${IMAGE_NAME}:${{ gitea.sha }} \
            -t ${REGISTRY}/${IMAGE_NAME}:latest \
            thesis_review

      - name: Login to Gitea Container Registry
        if: gitea.event_name != 'pull_request'
        run: echo "${{ secrets.GITEA_TOKEN }}" | docker login ${REGISTRY} -u "${{ gitea.actor }}" --password-stdin

      - name: Push UNO image
        if: gitea.event_name != 'pull_request'
        run: |
          docker push ${REGISTRY}/${IMAGE_NAME}:${{ gitea.sha }}
          docker push ${REGISTRY}/${IMAGE_NAME}:latest
