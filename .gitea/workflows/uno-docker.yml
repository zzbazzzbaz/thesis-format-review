name: Thesis Review Docker CD

on:
  push:
    branches:
      - test
    paths:
      - "thesis_review/**"
      - "deploy/thesis_review/**"
      - ".gitea/workflows/uno-docker.yml"
  workflow_dispatch:

env:
  REGISTRY: git.gqt.plus
  IMAGE_NAME: gqt/thesis-review
  REMOTE_DIR: /home/ubuntu/thesis_review

jobs:
  docker-build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build application image
        run: |
          docker build \
            -f thesis_review/Dockerfile \
            -t ${REGISTRY}/${IMAGE_NAME}:${{ gitea.sha }} \
            -t ${REGISTRY}/${IMAGE_NAME}:latest \
            thesis_review

      - name: Login to Gitea Container Registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${REGISTRY} -u "${{ gitea.actor }}" --password-stdin

      - name: Push image
        run: |
          docker push ${REGISTRY}/${IMAGE_NAME}:${{ gitea.sha }}
          docker push ${REGISTRY}/${IMAGE_NAME}:latest

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: docker-build
    if: gitea.ref == 'refs/heads/test'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload docker compose
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 101.35.223.219
          username: ubuntu
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          source: "deploy/thesis_review/docker-compose.yml"
          target: "${{ env.REMOTE_DIR }}"
          strip_components: 2

      - name: Pull and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 101.35.223.219
          username: ubuntu
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          script: |
            set -eu
            cd "${{ env.REMOTE_DIR }}"
            echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ gitea.actor }}" --password-stdin
            IMAGE_TAG="${{ gitea.sha }}" docker compose pull
            IMAGE_TAG="${{ gitea.sha }}" docker compose up -d --remove-orphans
            docker compose ps
            sudo tee /etc/nginx/snippets/thesis_review.conf >/dev/null <<'NGINX'
            location = /thesis_review {
                return 301 /thesis_review/;
            }

            location ^~ /thesis_review/api/ {
                client_max_body_size 50m;
                rewrite ^/thesis_review/api/(.*)$ /api/$1 break;
                proxy_pass http://127.0.0.1:18080;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location ^~ /thesis_review/static/ {
                rewrite ^/thesis_review/static/(.*)$ /static/$1 break;
                proxy_pass http://127.0.0.1:18080;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location ^~ /thesis_review/ {
                client_max_body_size 50m;
                proxy_pass http://127.0.0.1:18080/;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                sub_filter_once off;
                sub_filter_types text/html application/javascript;
                sub_filter 'href="/static/' 'href="/thesis_review/static/';
                sub_filter 'src="/static/' 'src="/thesis_review/static/';
                sub_filter 'fetch("/api/' 'fetch("/thesis_review/api/';
            }
            NGINX
            sudo grep -q 'snippets/thesis_review.conf' /etc/nginx/conf.d/ice-rink-miniprogram.conf || \
              sudo sed -i '/server_name 101\.35\.223\.219;/a\\    include /etc/nginx/snippets/thesis_review.conf;' /etc/nginx/conf.d/ice-rink-miniprogram.conf
            sudo nginx -t
            sudo systemctl reload nginx
