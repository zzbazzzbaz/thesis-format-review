server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /thesis_reviews/frontend {
        return 301 /thesis_reviews/frontend/;
    }

    location /thesis_reviews/frontend/ {
        try_files $uri $uri/ /thesis_reviews/frontend/index.html;
    }
}
