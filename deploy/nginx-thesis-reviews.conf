location = /thesis_review/frontend {
    return 301 /thesis_review/frontend/;
}

location = /login {
    return 302 /thesis_review/frontend/login;
}

location = /admin {
    return 302 /thesis_review/admin/;
}

location /admin/ {
    return 302 /thesis_review$request_uri;
}

location /static/ {
    return 302 /thesis_review$request_uri;
}

location /media/ {
    return 302 /thesis_review$request_uri;
}

location /thesis_review/frontend/ {
    proxy_pass http://127.0.0.1:18181/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";
    proxy_redirect / /thesis_review/frontend/;
    proxy_cookie_path / /thesis_review/frontend/;
    sub_filter_once on;
    sub_filter '<head>' '<head><base href="/thesis_review/frontend/">';
}

location /api/ {
    proxy_pass http://127.0.0.1:18180/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";
    proxy_read_timeout 300s;
    client_max_body_size 50m;
}

location = /thesis_review {
    return 301 /thesis_review/;
}

location = /thesis_review/ {
    proxy_pass http://127.0.0.1:18180/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /thesis_review/ {
    proxy_pass http://127.0.0.1:18180/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    client_max_body_size 50m;
    proxy_redirect / /thesis_review/;
    proxy_cookie_path / /thesis_review/;
    sub_filter_once off;
    sub_filter_types *;
    sub_filter 'href="/admin/' 'href="/thesis_review/admin/';
    sub_filter 'action="/admin/' 'action="/thesis_review/admin/';
    sub_filter 'href="/api/' 'href="/thesis_review/api/';
    sub_filter 'src="/api/' 'src="/thesis_review/api/';
    sub_filter 'href="/static/' 'href="/thesis_review/static/';
    sub_filter 'src="/static/' 'src="/thesis_review/static/';
    sub_filter "url('/static/" "url('/thesis_review/static/";
    sub_filter 'href="/media/' 'href="/thesis_review/media/';
    sub_filter 'src="/media/' 'src="/thesis_review/media/';
}
