location = /login {
    return 302 /thesis_reviews/frontend/login;
}

location = /thesis_reviews/backend {
    return 301 /thesis_reviews/backend/;
}

location /thesis_reviews/backend/ {
    proxy_pass http://127.0.0.1:18080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    client_max_body_size 50m;
    sub_filter_once off;
    sub_filter_types text/html text/css application/javascript;
    sub_filter 'href="/admin/' 'href="/thesis_reviews/backend/admin/';
    sub_filter 'action="/admin/' 'action="/thesis_reviews/backend/admin/';
    sub_filter 'href="/static/' 'href="/thesis_reviews/backend/static/';
    sub_filter 'src="/static/' 'src="/thesis_reviews/backend/static/';
    sub_filter "url('/static/" "url('/thesis_reviews/backend/static/";
}

location = /thesis_reviews/frontend {
    return 301 /thesis_reviews/frontend/;
}

location /thesis_reviews/frontend/ {
    proxy_pass http://127.0.0.1:18081/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
