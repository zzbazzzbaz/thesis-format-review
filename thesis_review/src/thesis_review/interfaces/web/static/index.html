<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>毕业设计格式审核系统</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <main class="shell">
      <form id="review-form">
        <div class="field">
          <label for="file">选择 Word 文档</label>
          <input id="file" name="file" type="file" accept=".docx" required>
        </div>
        <button id="submit" type="submit">开始审核</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script>
      const form = document.querySelector("#review-form");
      const fileInput = document.querySelector("#file");
      const submit = document.querySelector("#submit");
      const status = document.querySelector("#status");

      function setStatus(message, className) {
        status.textContent = message;
        status.className = className ? `status ${className}` : "status";
      }

      function downloadBytes(bytes, type, filename) {
        const blob = new Blob([bytes], { type });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      function bytesOf(text) {
        return new TextEncoder().encode(text);
      }

      function findBytes(source, target, start) {
        for (let index = start; index <= source.length - target.length; index += 1) {
          let matched = true;
          for (let offset = 0; offset < target.length; offset += 1) {
            if (source[index + offset] !== target[offset]) {
              matched = false;
              break;
            }
          }
          if (matched) {
            return index;
          }
        }
        return -1;
      }

      function parseHeaders(text) {
        return Object.fromEntries(
          text.split(/\r?\n/)
            .filter(Boolean)
            .map((line) => {
              const index = line.indexOf(":");
              return [
                line.slice(0, index).trim().toLowerCase(),
                line.slice(index + 1).trim(),
              ];
            })
        );
      }

      function parseMultipartMixed(buffer, contentType) {
        const match = contentType.match(/boundary="?([^";]+)"?/i);
        if (!match) {
          throw new Error("missing multipart boundary");
        }

        const bytes = new Uint8Array(buffer);
        const delimiter = bytesOf(`--${match[1]}`);
        const headerSeparator = bytesOf("\r\n\r\n");
        const decoder = new TextDecoder();
        const parts = [];
        let cursor = findBytes(bytes, delimiter, 0);

        while (cursor !== -1) {
          let partStart = cursor + delimiter.length;
          if (bytes[partStart] === 45 && bytes[partStart + 1] === 45) {
            break;
          }
          if (bytes[partStart] === 13 && bytes[partStart + 1] === 10) {
            partStart += 2;
          }

          const next = findBytes(bytes, delimiter, partStart);
          if (next === -1) {
            break;
          }

          let partEnd = next;
          if (bytes[partEnd - 2] === 13 && bytes[partEnd - 1] === 10) {
            partEnd -= 2;
          }

          const headerEnd = findBytes(bytes, headerSeparator, partStart);
          if (headerEnd === -1 || headerEnd > partEnd) {
            throw new Error("invalid multipart part");
          }

          const headers = parseHeaders(decoder.decode(bytes.slice(partStart, headerEnd)));
          const disposition = headers["content-disposition"] || "";
          const name = (disposition.match(/name="([^"]+)"/) || [])[1] || "";
          const filename = (disposition.match(/filename="([^"]+)"/) || [])[1] || name;
          parts.push({
            name,
            filename,
            type: headers["content-type"] || "application/octet-stream",
            content: bytes.slice(headerEnd + headerSeparator.length, partEnd),
          });
          cursor = next;
        }

        return parts;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const file = fileInput.files[0];
        if (!file) {
          setStatus("请选择 .docx 文件", "error");
          return;
        }

        const data = new FormData();
        data.append("file", file);
        submit.disabled = true;
        setStatus("正在审核", "");

        try {
          const response = await fetch("/api/review", {
            method: "POST",
            body: data,
          });

          if (!response.ok) {
            let message = "审核失败";
            try {
              const payload = await response.json();
              if (payload.detail) {
                message = payload.detail;
              }
            } catch (error) {
              message = "审核失败";
            }
            setStatus(message, "error");
            return;
          }

          const stem = file.name.replace(/\.docx$/i, "");
          const parts = parseMultipartMixed(
            await response.arrayBuffer(),
            response.headers.get("content-type") || ""
          );
          const marked = parts.find((part) => part.name === "marked_docx");
          const issues = parts.find((part) => part.name === "issues_json");

          if (!marked || !issues) {
            throw new Error("missing review artifacts");
          }

          downloadBytes(marked.content, marked.type, `${stem}.marked.docx`);
          downloadBytes(issues.content, issues.type, `${stem}.issues.json`);
          setStatus("审核完成，已开始下载 Word 和 JSON", "success");
        } catch (error) {
          setStatus("审核失败，请稍后重试", "error");
        } finally {
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
