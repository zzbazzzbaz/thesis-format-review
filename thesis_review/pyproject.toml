[project]
name = "thesis-review"
version = "0.1.0"
description = "毕业设计论文格式审核系统"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "python-docx>=1.1", "httpx>=0.27"]

[project.scripts]
thesis-review = "thesis_review.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thesis_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "uno: 需要 LibreOffice/UNO 环境的测试",
]
