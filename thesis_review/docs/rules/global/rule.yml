module: global
module_name: 整体

rules:
  - id: global-margin-001
    title: 上边距
    severity: error
    status: deprecated
    description: 已废弃：纯 UNO API 导入 .docx 后页边距值可能被 LibreOffice 重解释，不适合作为该规则唯一判定依据；后续需基于 OOXML 页节属性重新设计。
    message: 页面上边距应为 2.6 cm
    expected: 2.6 cm
  - id: global-margin-002
    title: 下边距
    severity: error
    status: deprecated
    description: 已废弃：纯 UNO API 导入 .docx 后页边距值可能被 LibreOffice 重解释，不适合作为该规则唯一判定依据；后续需基于 OOXML 页节属性重新设计。
    message: 页面下边距应为 2.6 cm
    expected: 2.6 cm
  - id: global-margin-003
    title: 左边距
    severity: error
    status: deprecated
    description: 已废弃：纯 UNO API 导入 .docx 后页边距值可能被 LibreOffice 重解释，不适合作为该规则唯一判定依据；后续需基于 OOXML 页节属性重新设计。
    message: 页面左边距应为 2.6 cm
    expected: 2.6 cm
  - id: global-margin-004
    title: 右边距
    severity: error
    status: deprecated
    description: 已废弃：纯 UNO API 导入 .docx 后页边距值可能被 LibreOffice 重解释，不适合作为该规则唯一判定依据；后续需基于 OOXML 页节属性重新设计。
    message: 页面右边距应为 2.6 cm
    expected: 2.6 cm
  - id: global-header-001
    title: 页眉文本
    severity: error
    status: draft
    description: 检查中文摘要到附录范围内的页眉文本是否为“山东石油化工学院本科毕业设计（论文）”，封面不检查页眉。
    message: 非封面页页眉文本应为“山东石油化工学院本科毕业设计（论文）”
    expected: 山东石油化工学院本科毕业设计（论文）
  - id: global-header-002
    title: 页眉中文字体
    severity: error
    status: draft
    description: 检查中文摘要到附录范围内的页眉中文字体是否为黑体。
    message: 非封面页页眉中文字体应为黑体
    expected: 黑体
  - id: global-header-003
    title: 页眉字号
    severity: error
    status: draft
    description: 检查中文摘要到附录范围内的页眉字号是否为五号，即 10.5pt。
    message: 非封面页页眉字号应为五号
    expected: 五号（10.5pt）
  - id: global-header-004
    title: 页眉居中
    severity: error
    status: draft
    description: 检查中文摘要到附录范围内的页眉是否居中。
    message: 非封面页页眉应居中
    expected: 居中
  - id: global-footer-page-number-001
    title: 页码数字形式
    severity: error
    status: draft
    description: 检查正文到附录范围内页脚页码是否使用阿拉伯数字。
    message: 正文到附录页码应使用阿拉伯数字
    expected: 阿拉伯数字页码
  - id: global-footer-page-number-002
    title: 页码连续
    severity: error
    status: deprecated
    description: 已废弃：页码连续性依赖渲染页序、页码起始值和 section 映射，纯 UNO PageStyle 信息不足以稳定判定；后续需结合 OOXML 与渲染页模型重新设计。
    message: 正文到附录页码应连续编排
    expected: 连续页码
  - id: global-footer-page-number-003
    title: 页码居中
    severity: error
    status: draft
    description: 检查正文到附录范围内页码是否位于页脚中间。
    message: 正文到附录页码应位于页脚中间
    expected: 页脚居中
  - id: global-footer-page-number-004
    title: 页码字体
    severity: error
    status: draft
    description: 检查正文到附录范围内页码字体是否为 Times New Roman。
    message: 正文到附录页码字体应为 Times New Roman
    expected: Times New Roman
  - id: global-footer-page-number-005
    title: 页码字号
    severity: error
    status: draft
    description: 检查正文到附录范围内页码字号是否为五号，即 10.5pt。
    message: 正文到附录页码字号应为五号
    expected: 五号（10.5pt）
  - id: global-footer-page-number-excluded-001
    title: 封面无页码
    severity: error
    status: deprecated
    description: 已废弃：WPS 文本框页码在 UNO 中可能表现为 DrawPage shape，难以仅靠 UNO 稳定映射到封面区域；后续需结合 OOXML 页脚引用和区域模型重新设计。
    message: 封面不应显示页码
    expected: 无页码
  - id: global-footer-page-number-excluded-002
    title: 中文摘要无页码
    severity: error
    status: deprecated
    description: 已废弃：WPS 文本框页码在 UNO 中可能表现为 DrawPage shape，难以仅靠 UNO 稳定映射到中文摘要区域；后续需结合 OOXML 页脚引用和区域模型重新设计。
    message: 中文摘要不应显示页码
    expected: 无页码
  - id: global-footer-page-number-excluded-003
    title: 英文摘要无页码
    severity: error
    status: deprecated
    description: 已废弃：WPS 文本框页码在 UNO 中可能表现为 DrawPage shape，难以仅靠 UNO 稳定映射到英文摘要区域；后续需结合 OOXML 页脚引用和区域模型重新设计。
    message: 英文摘要不应显示页码
    expected: 无页码
  - id: global-footer-page-number-excluded-004
    title: 目录无页码
    severity: error
    status: deprecated
    description: 已废弃：WPS 文本框页码在 UNO 中可能表现为 DrawPage shape，难以仅靠 UNO 稳定映射到目录区域；后续需结合 OOXML 页脚引用和区域模型重新设计。
    message: 目录不应显示页码
    expected: 无页码
