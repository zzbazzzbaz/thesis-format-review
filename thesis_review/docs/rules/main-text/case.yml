cases:
  - id: main-text-heading-format
    file: samples/main-text-heading-format.docx
    description: 正文各级标题格式错误样本。
    error_description: 一级标题未使用“第X章”中文数字编号、编号后不是 2 个普通半角空格、未使用黑体三号、标题后不是正好 1 个空段落或未另起一页；二级标题未使用 N.N 编号、编号后不是 1 个普通半角空格、未使用黑体四号、1.5 倍行距和 Times New Roman 数字西文字体；三级标题未使用 N.N.N 编号、编号后不是 1 个普通半角空格、未首行缩进 2 字符、未使用黑体小四、1.5 倍行距和 Times New Roman 数字西文字体。
    expected_rule_ids:
      - main-text-heading-level-one-001
      - main-text-heading-level-one-002
      - main-text-heading-level-one-003
      - main-text-heading-level-one-004
      - main-text-heading-level-one-005
      - main-text-heading-level-one-006
      - main-text-heading-level-two-001
      - main-text-heading-level-two-002
      - main-text-heading-level-two-003
      - main-text-heading-level-two-004
      - main-text-heading-level-two-005
      - main-text-heading-level-two-006
      - main-text-heading-level-three-001
      - main-text-heading-level-three-002
      - main-text-heading-level-three-003
      - main-text-heading-level-three-004
      - main-text-heading-level-three-005
      - main-text-heading-level-three-006
      - main-text-heading-level-three-007

  - id: main-text-paragraph-and-citation-format
    file: samples/main-text-paragraph-and-citation-format.docx
    description: 正文普通段落和引用编号格式错误样本。
    error_description: 正文普通段落未使用小四字号、宋体中文字体、Times New Roman 西文和数字字体、首行缩进 2 字符、1.5 倍行距和两端对齐；正文参考文献引用未使用方括号数字格式，或引用编号未设置为上标、小四字号和 Times New Roman 字体。
    expected_rule_ids:
      - main-text-paragraph-001
      - main-text-paragraph-002
      - main-text-paragraph-003
      - main-text-paragraph-004
      - main-text-paragraph-005
      - main-text-paragraph-006
      - main-text-reference-citation-001
      - main-text-reference-citation-002
      - main-text-reference-citation-003
      - main-text-reference-citation-004

  - id: main-text-formula-format
    file: samples/main-text-formula-format.docx
    description: 正文公式格式错误样本。
    error_description: 正文公式缺少公式号，或公式号未按章编号为“(章号-序号)”，公式和编号整体未居中，公式编号未居右，或公式编号未使用五号 Times New Roman。
    expected_rule_ids:
      - main-text-formula-001
      - main-text-formula-002
      - main-text-formula-003
      - main-text-formula-004
      - main-text-formula-005
      - main-text-formula-006

  - id: main-text-figure-table-caption-format
    file: samples/main-text-figure-table-caption-format.docx
    description: 正文图片图题和表格表题格式错误样本。
    error_description: 图片缺少图题、图题未位于图片下方、图号未按章编号、图号与图题之间不是 1 个普通半角空格、图题未居中或未使用五号宋体；表格缺少表题、表题未位于表格上方、表号未按章编号、表号与表题之间不是 1 个普通半角空格、表题未居中或未使用五号宋体。
    expected_rule_ids:
      - main-text-figure-caption-001
      - main-text-figure-caption-002
      - main-text-figure-caption-003
      - main-text-figure-caption-004
      - main-text-figure-caption-005
      - main-text-figure-caption-006
      - main-text-figure-caption-007
      - main-text-table-caption-001
      - main-text-table-caption-002
      - main-text-table-caption-003
      - main-text-table-caption-004
      - main-text-table-caption-005
      - main-text-table-caption-006
      - main-text-table-caption-007
